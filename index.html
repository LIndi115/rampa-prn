<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PRN RAMP OPS — Shkumje</title>
  <meta name="theme-color" content="#070b14">
  <style>
    :root {
      --bg: #070b14;
      --panel: #0e1626;
      --card: #121d33;
      --line: #213254;
      --text: #f8fafc;
      --sub: #94a3b8;
      --cyan: #38bdf8;
      --cyan-bg: rgba(56, 189, 248, 0.14);
      --gold: #facc15;
      --green: #22c55e;
      --green-bg: #15803d;
      --amber: #f59e0b;
      --slate: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 44px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 11, 20, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
    }

    .top-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.4px;
    }

    .chip {
      background: var(--cyan-bg);
      color: var(--cyan);
      border: 1px solid rgba(56, 189, 248, 0.35);
      font-size: 11px;
      font-weight: 900;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .right-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .freeze-badge {
      font-size: 11px;
      font-weight: 700;
      color: #cbd5e1;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 6px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .freeze-badge.locked {
      color: #86efac;
      border-color: rgba(34, 197, 94, 0.45);
      background: rgba(21, 128, 61, 0.16);
    }

    .refresh-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #4ade80;
      background: var(--green-bg);
      color: #ffffff;
      font-size: 24px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 18px rgba(34, 197, 94, 0.35);
      transition: transform 0.14s ease, background 0.15s ease;
    }

    .refresh-circle:active {
      transform: scale(0.9);
      background: var(--green);
    }

    .refresh-circle.spin {
      animation: rot 0.7s linear infinite;
    }

    @keyframes rot {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .search-wrap {
      position: relative;
    }

    .reg-input {
      width: 100%;
      padding: 15px 46px 15px 16px;
      font-size: 20px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #ffffff;
      background: var(--panel);
      border: 2px solid var(--cyan);
      border-radius: 12px;
      outline: none;
    }

    .reg-input::placeholder {
      text-transform: none;
      letter-spacing: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--sub);
    }

    .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: #334155;
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: none;
    }

    .content {
      max-width: 860px;
      margin: 0 auto;
      padding: 16px 14px;
    }

    .idle-box {
      text-align: center;
      padding: 40px 20px;
      background: var(--panel);
      border: 1px dashed var(--line);
      border-radius: 14px;
      color: var(--sub);
      font-size: 15px;
    }

    .idle-box strong {
      color: var(--gold);
      font-size: 17px;
      display: block;
      margin-bottom: 6px;
    }

    .cards-wrap {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .aircraft-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 6px solid var(--green);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.38);
    }

    .aircraft-card.departed {
      border-left-color: var(--slate);
    }

    .aircraft-card.delayed {
      border-left-color: var(--amber);
    }

    .hero-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .kicker {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--sub);
      margin-bottom: 3px;
    }

    .reg-big {
      font-size: 28px;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: 1px;
      line-height: 1.05;
    }

    .stand-box {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border: 1px solid rgba(125, 211, 252, 0.35);
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 10px;
      text-align: right;
    }

    .stand-box .kicker {
      color: #bae6fd;
      margin-bottom: 1px;
    }

    .stand-big {
      font-size: 21px;
      font-weight: 900;
      line-height: 1.1;
    }

    .dest-box {
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 13px;
      margin-bottom: 12px;
    }

    .dest-big {
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .info-cell {
      background: var(--bg);
      border: 1px solid #1b2842;
      border-radius: 9px;
      padding: 9px 11px;
    }

    .info-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--sub);
      margin-bottom: 3px;
    }

    .info-val {
      font-size: 14px;
      font-weight: 800;
      color: #f1f5f9;
      word-break: break-word;
    }

    .status-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 9px;
      background: var(--cyan-bg);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .status-strip.done {
      background: rgba(100, 116, 139, 0.18);
      border-color: rgba(100, 116, 139, 0.35);
    }

    .status-strip.warn {
      background: rgba(245, 158, 11, 0.16);
      border-color: rgba(245, 158, 11, 0.35);
    }

    .status-lbl {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--sub);
    }

    .status-val {
      font-size: 15px;
      font-weight: 900;
      color: #7dd3fc;
    }

    .status-strip.done .status-val {
      color: #e2e8f0;
    }

    .status-strip.warn .status-val {
      color: #fcd34d;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="top-head">
      <div class="brand">
        <span class="chip">SHKUMJE</span>
        <span>PRN RAMP OPS</span>
      </div>

      <div class="right-box">
        <span class="freeze-badge" id="freezeBadge">Gati</span>
        <button class="refresh-circle" id="refreshBtn" title="Ngarko të dhënat e fundit dhe ngrije listën" onclick="loadData()">↻</button>
      </div>
    </div>

    <div class="search-wrap">
      <input
        type="text"
        id="regInput"
        class="reg-input"
        placeholder="Shkruaj regjistrimin e avionit (p.sh. LZCRI)..."
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      >
      <button class="clear-btn" id="clearBtn" onclick="clearReg()">✕</button>
    </div>
  </header>

  <main class="content" id="content">
    <div class="idle-box">
      <strong>Shkruaj regjistrimin e avionit lart</strong>
      Sapo të shkruash regjistrimin (p.sh. <b>LZCRI</b>), të dalin menjëherë të gjitha të dhënat e atij avioni.
    </div>
  </main>

  <script>
    const WORKER_URL = "https://twilight-waterfall-cef0.lindiismajli97.workers.dev";
    const TARGET_URL = "https://flights.limakkosovo.aero/dep.php";
    const AUTH_USER = "flight";
    const AUTH_PASS = "!P4N@1702";

    let flights = [];
    let dataLoaded = false;

    const regInput = document.getElementById("regInput");
    const clearBtn = document.getElementById("clearBtn");
    const content = document.getElementById("content");
    const freezeBadge = document.getElementById("freezeBadge");
    const refreshBtn = document.getElementById("refreshBtn");

    regInput.addEventListener("input", () => {
      clearBtn.style.display = regInput.value ? "block" : "none";
      renderResult();
    });

    function clearReg() {
      regInput.value = "";
      clearBtn.style.display = "none";
      renderResult();
      regInput.focus();
    }

    function normalizeCode(str) {
      return (str || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function formatStatusSq(raw) {
      const s = (raw || "").replace(/\s+/g, " ").trim();
      const u = s.toUpperCase();
      if (!u) return "PA STATUS";
      if (u.includes("DEPARTED")) return s.replace(/DEPARTED/i, "I NISUR");
      if (u.includes("EXPECTED")) return s.replace(/EXPECTED/i, "I PRITUR");
      if (u.includes("SCHEDULED")) return "I PLANIFIKUAR";
      if (u.includes("DELAYED")) return s.replace(/DELAYED/i, "I VONUAR");
      if (u.includes("CANCEL")) return "I ANULUAR";
      if (u.includes("BOARDING")) return "IMBarkim / BOARDING";
      return u;
    }

    function isHeaderRow(cells) {
      const upper = cells.map(x => x.toUpperCase());
      return (
        upper.includes("FLIGHT NUMBER") ||
        upper.includes("REG") ||
        (upper[0] === "DATE" && upper[1] === "FLIGHT NUMBER")
      );
    }

    function mapRow(cells) {
      const c = cells.map(x => (x || "—").replace(/\s+/g, " ").trim() || "—");
      return {
        date: c[0],
        flight: c[1],
        airline: c[2],
        destination: c[3],
        schedule: c[4],
        etd: c[5],
        acType: c[6],
        reg: c[7],
        checkin: c[8],
        gate: c[9],
        stand: c[10],
        status: c[11] || ""
      };
    }

    function parseFlightsFromHtml(htmlText) {
      const doc = new DOMParser().parseFromString(htmlText, "text/html");
      const tables = [...doc.querySelectorAll("table")];
      const table = tables.find(t => t.querySelectorAll("tr").length > 1) || tables[0];
      if (!table) return [];

      const trList = [...table.querySelectorAll("tr")];
      const parsed = [];

      for (const tr of trList) {
        const tdList = [...tr.querySelectorAll("td")];
        if (tdList.length < 7) continue;
        const cells = tdList.map(td => td.innerText.replace(/\s+/g, " ").trim());
        if (isHeaderRow(cells)) continue;
        const item = mapRow(cells);
        if (item.flight !== "—" || item.reg !== "—") {
          parsed.push(item);
        }
      }

      return parsed;
    }

    async function fetchHtmlFromSource() {
      const workerEndpoint = `${WORKER_URL}?type=dep&url=${encodeURIComponent(TARGET_URL)}&u=${encodeURIComponent(AUTH_USER)}&p=${encodeURIComponent(AUTH_PASS)}&t=${Date.now()}`;
      const res = await fetch(workerEndpoint, { cache: "no-store" });
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }
      return await res.text();
    }

    async function loadData() {
      refreshBtn.classList.add("spin");
      freezeBadge.classList.remove("locked");
      freezeBadge.textContent = "Duke ngarkuar...";

      try {
        const htmlText = await fetchHtmlFromSource();
        flights = parseFlightsFromHtml(htmlText);
        dataLoaded = true;

        const nowTime = new Date().toTimeString().slice(0, 8);
        freezeBadge.classList.add("locked");
        freezeBadge.textContent = `Ngrirë • ${nowTime} (${flights.length})`;
        renderResult();
      } catch (err) {
        freezeBadge.classList.remove("locked");
        freezeBadge.textContent = "Gabim ngarkimi";
        content.innerHTML = `
          <div class="idle-box">
            <strong>Nuk u ngarkuan të dhënat (${err.message})</strong>
            Shtyp butonin e gjelbër ↻ për të provuar sërish.
          </div>
        `;
      } finally {
        refreshBtn.classList.remove("spin");
      }
    }

    function renderResult() {
      const rawQuery = regInput.value.trim();
      const normQuery = normalizeCode(rawQuery);

      if (!normQuery) {
        content.innerHTML = `
          <div class="idle-box">
            <strong>Shkruaj regjistrimin e avionit lart</strong>
            ${dataLoaded
              ? `Të dhënat janë të ngrira dhe gati (${flights.length} shkumje). Shkruaj p.sh. <b>LZCRI</b> ose <b>HBUVD</b>.`
              : `Duke ngarkuar të dhënat...`}
          </div>
        `;
        return;
      }

      const matches = flights.filter(f => normalizeCode(f.reg).includes(normQuery));

      if (!matches.length) {
        content.innerHTML = `
          <div class="idle-box">
            <strong>Nuk u gjet asnjë avion me regjistrimin "${rawQuery.toUpperCase()}"</strong>
            Kontrollo regjistrimin ose shtyp butonin e gjelbër ↻ për të rifreskuar listën.
          </div>
        `;
        return;
      }

      content.innerHTML = `<div class="cards-wrap">` + matches.map(f => {
        const up = f.status.toUpperCase();
        const gone = up.includes("DEPARTED") || up.includes("CANCEL");
        const late = up.includes("DELAYED");
        const cardCls = gone ? "aircraft-card departed" : (late ? "aircraft-card delayed" : "aircraft-card");
        const stCls = gone ? "status-strip done" : (late ? "status-strip warn" : "status-strip");

        return `
          <article class="${cardCls}">
            <div class="hero-row">
              <div>
                <div class="kicker">Regjistrimi (REG)</div>
                <div class="reg-big">${f.reg}</div>
              </div>
              <div class="stand-box">
                <div class="kicker">Stand / Parkimi</div>
                <div class="stand-big">${f.stand}</div>
              </div>
            </div>

            <div class="dest-box">
              <div class="kicker">Destinacioni (Ku shkon)</div>
              <div class="dest-big">🛫 ${f.destination}</div>
            </div>

            <div class="info-grid">
              <div class="info-cell">
                <div class="info-label">Data</div>
                <div class="info-val">${f.date}</div>
              </div>
              <div class="info-cell">
                <div class="info-label">Numri i fluturimit</div>
                <div class="info-val">${f.flight}</div>
              </div>
              <div class="info-cell">
                <div class="info-label">Kompania</div>
                <div class="info-val">${f.airline}</div>
              </div>
              <div class="info-cell">
                <div class="info-label">Destinacioni</div>
                <div class="info-val">${f.destination}</div>
              </div>
              <div class="info-cell">
                <div class="info-label">Koha e nisjes (Schedule)</div>
                <div class="info-val">${f.schedule}</div>
              </div>
              <div class="info-cell">
                <div class="info-label">Nisja e parashikuar (ETD)</div>
                <div class="info-val">${f.etd}</div>
              </div>
              <div class="info-cell">
                <div class="info-label">Tipi i avionit (A/C Type)</div>
                <div class="info-val">${f.acType}</div>
              </div>
              <div class="info-cell">
                <div class="info-label">Regjistrimi (REG)</div>
                <div class="info-val">${f.reg}</div>
              </div>
              <div class="info-cell">
                <div class="info-label">Check-In</div>
                <div class="info-val">${f.checkin}</div>
              </div>
              <div class="info-cell">
                <div class="info-label">Gate</div>
                <div class="info-val">${f.gate}</div>
              </div>
              <div class="info-cell">
                <div class="info-label">Stand / Parkimi</div>
                <div class="info-val">${f.stand}</div>
              </div>
              <div class="info-cell">
                <div class="info-label">Statusi / Nisja</div>
                <div class="info-val">${formatStatusSq(f.status)}</div>
              </div>
            </div>

            <div class="${stCls}">
              <span class="status-lbl">Gjendja</span>
              <span class="status-val">${formatStatusSq(f.status)}</span>
            </div>
          </article>
        `;
      }).join("") + `</div>`;
    }

    loadData();
  </script>
</body>
</html>
